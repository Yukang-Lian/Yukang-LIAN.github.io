<style>
.mfig { --va:#2a78d6; --vb:#eb6834; display:block; margin:0 auto; max-width:100%; height:auto; color:inherit; }
.mtr-wrap { --va:#2a78d6; --vb:#eb6834; }
body.quarto-dark .mfig, body.quarto-dark .mtr-wrap { --va:#3987e5; --vb:#d95926; }
.mfig .grid0 { stroke:currentColor; stroke-width:1; opacity:.07; }
.mfig .axis0 { stroke:currentColor; stroke-width:1; opacity:.22; }
.mfig .grid1 { stroke:currentColor; stroke-width:1; opacity:.22; fill:none; }
.mfig .axis1 { stroke:currentColor; stroke-width:1.3; opacity:.45; fill:none; }
.mfig .circ0 { fill:none; stroke:currentColor; stroke-width:1.2; stroke-dasharray:4 4; opacity:.4; }
.mfig .circ1 { fill:none; stroke:currentColor; stroke-width:2; }
.mfig .sq { fill:currentColor; opacity:.13; stroke:none; }
.mfig .va { stroke:var(--va); } .mfig .vb { stroke:var(--vb); }
.mfig .ha { fill:var(--va); } .mfig .hb { fill:var(--vb); }
.mfig line.col { stroke-width:2.4; stroke-linecap:round; }
.mfig text { fill:currentColor; font-family:inherit; font-size:17px; }
.mfig text.v { font-style:italic; font-size:18px; }
.mfig text.ta { fill:var(--va); } .mfig text.tb { fill:var(--vb); }
.mfig .vecarrow { fill:none; stroke:currentColor; stroke-width:1.1; stroke-linecap:round; stroke-linejoin:round; }
.mfig .handle { fill:transparent; stroke-width:1.5; cursor:grab; touch-action:none; }
.mfig .handle.a { stroke:var(--va); } .mfig .handle.b { stroke:var(--vb); }
.mtr-btns { display:flex; flex-wrap:wrap; justify-content:center; gap:.4rem; margin-top:.5rem; }
.mtr-btns button { font:inherit; font-size:.85rem; color:inherit; background:transparent; border:1px solid currentColor; border-radius:3px; padding:.1rem .6rem; opacity:.7; cursor:pointer; }
.mtr-btns button:hover { opacity:1; }
.mtr-read { text-align:center; font-size:.9rem; font-variant-numeric:tabular-nums; margin-top:.4rem; line-height:1.7; min-height:5.4em; }
.mtr-read .ca { color:var(--va); } .mtr-read .cb { color:var(--vb); }
</style>
<div class="mtr-wrap" id="mtr">
<svg class="mfig" viewBox="0 0 460 320" width="460" role="img" aria-label="Interactive figure: drag the two columns of a 2 by 2 matrix and watch the grid, the unit circle and the unit square transform.">
  <g class="g0"></g>
  <circle class="circ0"/>
  <path class="sq"/>
  <g class="g1"></g>
  <path class="circ1"/>
  <line class="col va su"/><path class="ha hu"/>
  <line class="col vb sv"/><path class="hb hv"/>
  <text class="v ta lu" data-vec="0">u</text><text class="v tb lv" data-vec="0">v</text>
  <circle class="handle a" r="11"/><circle class="handle b" r="11"/>
</svg>
<div class="mtr-btns">
  <button data-m="1,0,0,1">Identity</button>
  <button data-m="2,0,0,1">Stretch</button>
  <button data-m="0,1,-1,0">Rotate</button>
  <button data-m="1,0,1,1">Shear</button>
  <button data-m="1,0,0,0">Project</button>
  <button data-m="1,0.5,2,1">Dependent</button>
</div>
<div class="mtr-read"></div>
</div>
<script>
// Draw a small arrow above each vector letter in figure labels (the letters listed in data-vec).
window.vecArrows = window.vecArrows || function (svg) {
  svg.querySelectorAll('.vecarrow').forEach(function (e) { e.remove(); });
  svg.querySelectorAll('text[data-vec]').forEach(function (t) {
    var col = getComputedStyle(t).fill;
    t.getAttribute('data-vec').split(',').forEach(function (i) {
      var r = t.getExtentOfChar(+i), y = r.y + r.height * .1, x0 = r.x + r.width * .2, x1 = r.x + r.width * 1.05;
      var a = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      a.setAttribute('class', 'vecarrow');
      a.setAttribute('d', 'M' + x0 + ',' + y + ' L' + x1 + ',' + y + ' M' + (x1 - 3) + ',' + (y - 2.4) + ' L' + x1 + ',' + y + ' L' + (x1 - 3) + ',' + (y + 2.4));
      if (/\bt[ab]\b/.test(t.getAttribute('class'))) a.style.stroke = col;   // ink labels follow currentColor via CSS
      t.parentNode.appendChild(a);
    });
  });
};
(function () {
  var root = document.getElementById('mtr'), svg = root.querySelector('svg');
  var S = 40, OX = 230, OY = 165, W = 460, H = 320;      // px per unit, origin, size
  var m = { u: [1.5, 0.5], v: [-0.5, 1] };               // the columns of A
  var q = function (s) { return svg.querySelector(s); };
  // the same figure serves the Chinese translation
  var zh = /^zh/.test(document.documentElement.lang);
  var T = zh ? {
    btn: ['恒等', '拉伸', '旋转', '剪切', '投影', '列相关'],
    flip: '圆变成椭圆，而且平面被翻了过来，就像镜像。', area: '圆变成椭圆，所有面积都乘以 \\(|\\det A|\\)。',
    line: '两列落在同一条直线上：整个平面被压到这条直线上，圆变成一条线段。', zero: '两列都是零向量：一切都被压缩到原点。'
  } : {
    btn: null,
    flip: 'The circle becomes an ellipse, and the plane is flipped over, like a mirror image.', area: 'The circle becomes an ellipse, and every area is scaled by \\(|\\det A|\\).',
    line: 'The columns lie on one line: the whole plane collapses onto it, and the circle becomes a segment.', zero: 'Both columns are zero: everything collapses to the origin.'
  };
  if (T.btn) root.querySelectorAll('.mtr-btns button').forEach(function (b, i) { b.textContent = T.btn[i]; });
  var px = function (p) { return [OX + S * p[0], OY - S * p[1]]; };
  var A = function (x, y) { return [m.u[0] * x + m.v[0] * y, m.u[1] * x + m.v[1] * y]; };
  var set = function (el, o) { for (var k in o) el.setAttribute(k, o[k]); };

  // the untouched grid, for reference
  var h = '';
  for (var x = -6; x <= 6; x++) h += '<line class="' + (x ? 'grid0' : 'axis0') + '" x1="' + (OX + S * x) + '" y1="0" x2="' + (OX + S * x) + '" y2="' + H + '"/>';
  for (var y = -4; y <= 4; y++) h += '<line class="' + (y ? 'grid0' : 'axis0') + '" x1="0" y1="' + (OY - S * y) + '" x2="' + W + '" y2="' + (OY - S * y) + '"/>';
  q('.g0').innerHTML = h;
  set(q('.circ0'), { cx: OX, cy: OY, r: S });

  function arrow(line, head, p) {
    var e = px(p), d = Math.hypot(e[0] - OX, e[1] - OY);
    if (d < 1) { set(line, { x1: OX, y1: OY, x2: OX, y2: OY }); head.setAttribute('d', ''); return; }
    var ux = (e[0] - OX) / d, uy = (e[1] - OY) / d, L = Math.min(13, d * .5), Wd = L * .42, bx = e[0] - ux * L, by = e[1] - uy * L;
    set(line, { x1: OX, y1: OY, x2: bx + ux * 2, y2: by + uy * 2 });
    head.setAttribute('d', 'M' + e[0] + ',' + e[1] + ' L' + (bx - uy * Wd) + ',' + (by + ux * Wd) + ' L' + (bx + uy * Wd) + ',' + (by - ux * Wd) + ' Z');
  }
  var P = function (p) { var e = px(p); return e[0].toFixed(1) + ',' + e[1].toFixed(1); };

  function draw() {
    // where the grid lines go: the line x = i becomes i*u + t*v, and y = j becomes t*u + j*v
    var N = 12, g = '';
    for (var i = -N; i <= N; i++) {
      g += '<path class="' + (i ? 'grid1' : 'axis1') + '" d="M' + P(A(i, -N)) + ' L' + P(A(i, N)) + '"/>';
      g += '<path class="' + (i ? 'grid1' : 'axis1') + '" d="M' + P(A(-N, i)) + ' L' + P(A(N, i)) + '"/>';
    }
    q('.g1').innerHTML = g;
    q('.sq').setAttribute('d', 'M' + P([0, 0]) + ' L' + P(A(1, 0)) + ' L' + P(A(1, 1)) + ' L' + P(A(0, 1)) + ' Z');
    var c = '';
    for (var k = 0; k <= 96; k++) { var t = k / 96 * 2 * Math.PI; c += (k ? ' L' : 'M') + P(A(Math.cos(t), Math.sin(t))); }
    q('.circ1').setAttribute('d', c);
    arrow(q('.su'), q('.hu'), m.u); arrow(q('.sv'), q('.hv'), m.v);
    var pu = px(m.u), pv = px(m.v);
    set(q('.handle.a'), { cx: pu[0], cy: pu[1] }); set(q('.handle.b'), { cx: pv[0], cy: pv[1] });
    // labels sit just past each tip, u on its clockwise side and v on its counterclockwise side, so they never meet
    var lab = function (el, p, alt, side) {
      var n = Math.hypot(p[0], p[1]), d = n > 1e-9 ? [p[0] / n, p[1] / n] : alt;
      var e = px([p[0] + d[0] * .35 + side * d[1] * .45, p[1] + d[1] * .35 - side * d[0] * .45]);
      set(el, { x: e[0], y: e[1], 'text-anchor': 'middle', 'dominant-baseline': 'middle' });
    };
    lab(q('.lu'), m.u, [1, 0], 1); lab(q('.lv'), m.v, [0, 1], -1); vecArrows(svg);
  }

  function read() {
    var u = m.u, v = m.v, n1 = function (x) { var r = Math.round(x * 10) / 10; return (r === 0 ? 0 : r).toFixed(1); };
    var det = Math.round((u[0] * v[1] - v[0] * u[1]) * 100) / 100; if (det === 0) det = 0;
    var zero = function (p) { return Math.abs(p[0]) < 1e-9 && Math.abs(p[1]) < 1e-9; };
    var rank = Math.abs(det) > 1e-9 ? 2 : (zero(u) && zero(v) ? 0 : 1);
    var N = function (x) { var t = n1(x); return t.charAt(0) === '-' ? '(' + t + ')' : t; };
    var U = function (x) { return '\\class{ca}{' + n1(x) + '}'; }, V = function (x) { return '\\class{cb}{' + n1(x) + '}'; };
    var msg = rank === 2 ? (det < 0 ? T.flip : T.area) : rank === 1 ? T.line : T.zero;
    typeset('\\(A=\\begin{bmatrix}' + U(u[0]) + '&' + V(v[0]) + '\\\\' + U(u[1]) + '&' + V(v[1]) + '\\end{bmatrix}\\qquad' +
      '\\det A=' + N(u[0]) + '\\times' + N(v[1]) + '-' + N(v[0]) + '\\times' + N(u[1]) + '=' + det.toFixed(2) +
      '\\qquad\\operatorname{rank}A=' + rank + '\\)<br>' + msg);
  }

  var out = root.querySelector('.mtr-read'), busy = false, next = null;
  function typeset(html) {
    next = html;
    if (busy) return;
    busy = true;
    var ready = window.MathJax && MathJax.startup && MathJax.startup.promise;
    if (!ready) return setTimeout(function () { busy = false; typeset(next); }, 200);
    MathJax.startup.promise.then(function () {
      var h = next; next = null;
      MathJax.typesetClear([out]); out.innerHTML = h;
      return MathJax.typesetPromise([out]);
    }).catch(function () {}).then(function () { busy = false; if (next) typeset(next); });
  }

  // examples: animate from the current matrix to the chosen one
  var anim = null;
  root.querySelectorAll('.mtr-btns button').forEach(function (b) {
    b.addEventListener('click', function () {
      var t = b.getAttribute('data-m').split(',').map(Number), from = { u: m.u.slice(), v: m.v.slice() }, t0 = performance.now();
      var to = { u: [t[0], t[1]], v: [t[2], t[3]] }, id = {};
      anim = id;
      (function step(now) {
        if (anim !== id) return;
        var s = Math.min(1, (now - t0) / 700), e = s < .5 ? 2 * s * s : 1 - Math.pow(-2 * s + 2, 2) / 2;
        ['u', 'v'].forEach(function (k) { m[k] = [from[k][0] + (to[k][0] - from[k][0]) * e, from[k][1] + (to[k][1] - from[k][1]) * e]; });
        draw();
        if (s < 1) requestAnimationFrame(step); else { anim = null; read(); }
      })(t0);
    });
  });

  var drag = null;
  function toMath(ev) {
    var pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
    var p = pt.matrixTransform(svg.getScreenCTM().inverse());
    var c = function (x, lo, hi) { return Math.max(lo, Math.min(hi, Math.round(x * 10) / 10)); };
    return [c((p.x - OX) / S, -5.5, 5.5), c((OY - p.y) / S, -3.8, 3.8)];
  }
  [['a', 'u'], ['b', 'v']].forEach(function (kv) {
    var hd = q('.handle.' + kv[0]), k = kv[1];
    hd.addEventListener('pointerdown', function (ev) { anim = null; drag = k; hd.setPointerCapture(ev.pointerId); ev.preventDefault(); });
    hd.addEventListener('pointermove', function (ev) { if (drag !== k) return; m[k] = toMath(ev); draw(); read(); });
    hd.addEventListener('pointerup', function () { drag = null; });
  });
  draw(); read();
  if (document.fonts) document.fonts.ready.then(function () { vecArrows(svg); });
  new MutationObserver(function () { vecArrows(svg); }).observe(document.body, { attributes: true, attributeFilter: ['class'] });
})();
</script>
