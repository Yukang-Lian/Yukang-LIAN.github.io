<style>
.vfig { --va:#2a78d6; --vb:#eb6834; display:block; margin:0 auto; max-width:100%; height:auto; color:inherit; }
body.quarto-dark .vfig { --va:#3987e5; --vb:#d95926; }
.vfig .va { stroke:var(--va); } .vfig .vb { stroke:var(--vb); }
.vfig .ink { stroke:currentColor; }
.vfig .ha { fill:var(--va); } .vfig .hb { fill:var(--vb); } .vfig .hi { fill:currentColor; }
.vfig line, .vfig path.arc { fill:none; stroke-width:2.2; stroke-linecap:round; }
.vfig path.arc { stroke-width:1.2; }
.vfig .dash { stroke-dasharray:5 5; stroke-width:1.3; opacity:.6; }
.vfig text { fill:currentColor; font-family:inherit; font-size:17px; }
.vfig text.v { font-style:italic; font-size:18px; }
.vfig .vecarrow { fill:none; stroke-width:1.1; stroke-linecap:round; stroke-linejoin:round; }
.vfig text.ta { fill:var(--va); } .vfig text.tb { fill:var(--vb); }
.vfig text.g { font-style:italic; font-size:16px; }
</style>
<svg class="vfig" viewBox="0 0 330 225" width="330" role="img" aria-label="Vector b placed at the tip of a; the third side is a plus b, the inside angle is pi minus theta and theta appears outside.">
<line class="ink dash" x1="214.0" y1="154.0" x2="272.9" y2="139.3"/>
<line class="va" x1="30.0" y1="200.0" x2="203.3" y2="156.7"/>
<path class="ha" d="M214.0,154.0 L202.7,162.5 L200.1,151.8 Z"/>
<line class="vb" x1="214.0" y1="154.0" x2="277.5" y2="43.9"/>
<path class="hb" d="M283.0,34.4 L281.3,48.4 L271.7,42.9 Z"/>
<line class="ink" x1="30.0" y1="200.0" x2="273.8" y2="40.4"/>
<path class="hi" d="M283.0,34.4 L275.1,46.1 L269.1,36.9 Z"/>
<path class="arc ink" d="M223.0,138.4 A18,18 0 0 0 196.5,158.4"/>
<text class="g" x="179.4" y="134.0" text-anchor="middle" dominant-baseline="middle">π − θ</text>
<path class="arc ink" d="M252.8,144.3 A40,40 0 0 0 234.0,119.4"/>
<text class="g" x="262.4" y="125.9" text-anchor="middle" dominant-baseline="middle">θ</text>
<text class="v ta" x="125.9" y="192.5" text-anchor="middle" dominant-baseline="middle" data-vec="0">a</text>
<text class="v tb" x="262.4" y="102.2" text-anchor="middle" dominant-baseline="middle" data-vec="0">b</text>
<text class="v" x="142.3" y="95.4" text-anchor="middle" dominant-baseline="middle" data-vec="0,4">a + b</text>
<text class="g" x="20.1" y="209.9" text-anchor="middle" dominant-baseline="middle">O</text>
</svg>
<script>
// Draw a small arrow above each vector letter in figure labels (the letters listed in data-vec).
window.vecArrows = window.vecArrows || function (svg) {
  svg.querySelectorAll('.vecarrow').forEach(function (e) { e.remove(); });
  svg.querySelectorAll('text[data-vec]').forEach(function (t) {
    var col = getComputedStyle(t).fill;
    t.getAttribute('data-vec').split(',').forEach(function (i) {
      var r = t.getExtentOfChar(+i), y = r.y + r.height * .1, x0 = r.x + r.width * .2, x1 = r.x + r.width * 1.05;
      var a = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      a.setAttribute('class', 'vecarrow');
      a.setAttribute('d', 'M' + x0 + ',' + y + ' L' + x1 + ',' + y + ' M' + (x1 - 3) + ',' + (y - 2.4) + ' L' + x1 + ',' + y + ' L' + (x1 - 3) + ',' + (y + 2.4));
      a.style.stroke = col;
      t.parentNode.appendChild(a);
    });
  });
};
(function (svg) {
  var go = function () { vecArrows(svg); };
  go(); if (document.fonts) document.fonts.ready.then(go);
  new MutationObserver(go).observe(document.body, { attributes: true, attributeFilter: ['class'] });
})(document.currentScript.previousElementSibling);
</script>
