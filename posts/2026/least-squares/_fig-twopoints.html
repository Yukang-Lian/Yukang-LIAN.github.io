<div class="p2d" id="p2-two">
<svg role="img" aria-label="Interactive figure: the parabolas y = a x² + (2 − a) all pass through (−1, 2) and (1, 2). A slider changes a. A button adds the point (0, 1), which only the parabola with a = 1, y = x² + 1, passes through."></svg>
<div class="m3d-ctl"></div>
<div class="m3d-read tall"></div>
</div>
<script>
(function () {
  var M = M3D, root = document.getElementById('p2-two'), svg = root.querySelector('svg'), ctl = root.querySelector('.m3d-ctl');
  var F = P2D(svg, { x0: -2.6, x1: 2.6, y0: -1.2, y1: 4.8 });
  var a = 2, three = false;
  // every parabola through (−1, 2) and (1, 2): y = a x² + (2 − a)
  var par = function (k) { return function (x) { return k * x * x + 2 - k; }; };
  function draw() {
    var h = F.grid();
    [-1, -0.5, 0, 0.5, 1, 1.5, 2, 2.5, 3].forEach(function (k) { h += '<path class="fam" d="' + F.curve(par(k)) + '"/>'; });
    h += '<path class="cv va" d="' + F.curve(par(a)) + '"/>';
    h += F.dot([-1, 2]) + F.dot([1, 2]);
    if (three) h += F.dot([0, 1], 'db') + F.text([0, 1], '(0, 1)', 's tb', 30, 12);
    svg.innerHTML = h;
  }
  var n = function (v) { return String(+v.toFixed(1)); };
  var term = function (k, v, first) { if (Math.abs(k) < 1e-9) return ''; var s = k < 0 ? '-' : first ? '' : '+', m = Math.abs(k); return s + (m === 1 && v ? '' : n(m)) + v; };
  var read = M.typesetter(root.querySelector('.m3d-read'));
  function show() {
    var t = a - 1, y = term(a, 'x^2', 1), c = term(2 - a, '', !y);
    var msg = !three
      ? { en: 'Every curve here passes through \\((-1,2)\\) and \\((1,2)\\). Changing \\(a\\) adds more or less of \\(x^2-1\\), which is zero at both points.', zh: '这里每条曲线都经过 \\((-1,2)\\) 和 \\((1,2)\\)。改变 \\(a\\)，就是加上多一点或少一点 \\(x^2-1\\)，而它在这两点都等于零。' }
      : Math.abs(t) < 0.05
        ? { en: 'Only \\(a=1\\) also passes through \\((0,1)\\): the three points pin down \\(y=x^2+1\\).', zh: '只有 \\(a=1\\) 还经过 \\((0,1)\\)：三个点确定了唯一的 \\(y=x^2+1\\)。' }
        : { en: 'This curve crosses \\(x=0\\) at \\(y=' + n(2 - a) + '\\), not at \\(1\\). Only \\(a=1\\) fits all three points.', zh: '这条曲线在 \\(x=0\\) 处的值是 \\(' + n(2 - a) + '\\)，不是 \\(1\\)。只有 \\(a=1\\) 能同时经过三个点。' };
    read('\\(\\class{ca}{y=' + ((y + c) || '0') + '}\\)&emsp;\\((a,b,c)=(1,0,1)' + (Math.abs(t) < 1e-9 ? '' : (t < 0 ? '-' : '+') + n(Math.abs(t)) + '\\,(1,0,-1)') + '\\)<br>' + M.tr(msg));
  }
  var sl = M.slider(ctl, '<span><i>a</i></span>', -1, 3, 0.1, a, function (v) { a = v; draw(); show(); });
  var stop = null;
  M.buttons(ctl, [{ en: 'Two points', zh: '两个点' }, { en: 'Add (0, 1)', zh: '加上 (0, 1)' }], function (i) {
    if (stop) stop();
    three = i === 1; draw(); show();
    if (!three) return;
    var from = a;
    stop = M.tween(800, function (s) { a = from + (1 - from) * s; sl.set(a); draw(); }, function () { stop = null; a = 1; show(); });
  }, 0);
  draw(); show();
})();
</script>
