<div class="p2d" id="p2-fit">
<svg role="img" aria-label="Interactive figure: four points (−1, 2), (0, 1), (1, 2) and (2, y). A slider moves the fourth point. The least-squares parabola and its errors at each point are drawn, next to the dashed parabola y = x² + 1 through the first three points."></svg>
<div class="m3d-ctl"></div>
<div class="m3d-read tall"></div>
</div>
<script>
(function () {
  var M = M3D, root = document.getElementById('p2-fit'), svg = root.querySelector('svg'), ctl = root.querySelector('.m3d-ctl');
  var F = P2D(svg, { x0: -2.2, x1: 3.2, y0: -0.6, y1: 8.6 });
  var pts = [[-1, 2], [0, 1], [1, 2], [2, 6]];
  // least squares: solve the normal equations AᵀA w = Aᵀy for w = (a, b, c), with rows (x², x, 1)
  function fit() {
    var G = [[0, 0, 0], [0, 0, 0], [0, 0, 0]], r = [0, 0, 0];
    pts.forEach(function (p) {
      var row = [p[0] * p[0], p[0], 1];
      for (var i = 0; i < 3; i++) { r[i] += row[i] * p[1]; for (var j = 0; j < 3; j++) G[i][j] += row[i] * row[j]; }
    });
    var det = M.dot(G[0], M.cross(G[1], G[2]));
    return [0, 1, 2].map(function (k) { var H = G.map(function (g, i) { var s = g.slice(); s[k] = r[i]; return s; }); return M.dot(H[0], M.cross(H[1], H[2])) / det; });
  }
  var w;
  var f = function (x) { return w[0] * x * x + w[1] * x + w[2]; };
  function draw() {
    w = fit();
    var h = F.grid() + '<path class="ghost" d="' + F.curve(function (x) { return x * x + 1; }) + '"/>';
    h += '<path class="cv va" d="' + F.curve(f) + '"/>';
    pts.forEach(function (p) { if (Math.abs(p[1] - f(p[0])) > 0.01) h += F.line(p, [p[0], f(p[0])], 'res'); });
    pts.forEach(function (p, i) { h += F.dot(p, i === 3 ? 'db' : ''); });
    svg.innerHTML = h;
  }
  var n = function (v) { return String(+v.toFixed(3)); };
  var term = function (k, v, first) { k = +k.toFixed(3); if (!k) return ''; var s = k < 0 ? '-' : first ? '' : '+', m = Math.abs(k); return s + (m === 1 && v ? '' : n(m)) + v; };
  var read = M.typesetter(root.querySelector('.m3d-read'));
  function show() {
    var y = term(w[0], 'x^2', 1), d = pts[3][1] - 5, sse = pts.reduce(function (s, p) { return s + Math.pow(p[1] - f(p[0]), 2); }, 0);
    var big = Math.max.apply(null, pts.map(function (p) { return Math.abs(p[1] - f(p[0])); }));
    y += term(w[1], 'x', !y); y += term(w[2], '', !y);
    var msg = Math.abs(d) < 0.05
      ? { en: 'The fourth point lies on \\(y=x^2+1\\), so one parabola fits all four points exactly.', zh: '第四个点恰好在 \\(y=x^2+1\\) 上，所以一条抛物线就能精确经过全部四个点。' }
      : { en: 'No parabola passes through all four points. The least-squares fit (solid) misses each point by at most \\(' + n(big) + '\\), with squared errors adding up to \\(' + n(sse) + '\\). The dashed \\(y=x^2+1\\) fits the first three exactly but misses the fourth by \\(' + n(Math.abs(d)) + '\\), a total of \\(' + n(d * d) + '\\).', zh: '没有一条抛物线能经过全部四个点。最小二乘拟合（实线）在每个点的误差都不超过 \\(' + n(big) + '\\)，误差平方和是 \\(' + n(sse) + '\\)。虚线 \\(y=x^2+1\\) 精确经过前三个点，但在第四个点差了 \\(' + n(Math.abs(d)) + '\\)，平方和是 \\(' + n(d * d) + '\\)。' };
    read('\\(\\class{ca}{y=' + y + '}\\)<br>' + M.tr(msg));
  }
  M.slider(ctl, M.tr({ en: '<span>fourth point: <i>y</i></span>', zh: '<span>第四个点的 <i>y</i></span>' }), 3, 8, 0.1, pts[3][1], function (v) { pts[3][1] = v; draw(); show(); });
  draw(); show();
})();
</script>
