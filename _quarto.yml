project:
  type: website
  output-dir: _site
  # Self-hosted MathJax and fonts, so the site does not depend on outside servers.
  resources:
    - assets/

# The version this site was built and checked with.
quarto-required: ">=1.10.18 <1.11.0"

website:
  title: "Yukang Lian"
  site-url: https://yukang-lian.github.io/
  description: "Thoughts on the world, on myself, and on everything in between."
  navbar:
    left:
      - href: index.qmd
        text: Posts
      - href: about.qmd
        text: About
    right:
      - href: zh/index.qmd
        text: 中文
      - href: https://github.com/Yukang-Lian
        text: GitHub
  page-footer:
    center: "© Yukang Lian"

format:
  html:
    theme:
      light: [default, styles/light.scss, styles/rules.scss]
      dark: [default, styles/dark.scss, styles/rules.scss]
    html-math-method:
      method: mathjax
      url: /assets/mathjax/tex-chtml.js
    code-overflow: wrap
    lang: en
    anchor-sections: false
    smooth-scroll: false
    include-in-header: styles/mathjax.html
    include-after-body: styles/notes.html
    grid:
      sidebar-width: 260px
      body-width: 960px
      margin-width: 250px
      gutter-width: 1.4rem
